  /* ================= RENDER: ECONOMIA ================= */
  function renderEconomia(){
    const tx = allTx();
    const totalIncome = sumOfList(tx, 'income');
    const totalExpense = sumOfList(tx, 'expense');
    const balance = totalIncome - totalExpense;
    const monthTx = tx.filter(t=>monthKeyOf(t.date)===resumenMonth);

    let body = '';
    if(financeSubview==='movimientos') body = renderEconomiaMovimientos(tx);
    else if(financeSubview==='categorias') body = renderEconomiaCategorias();
    else body = renderEconomiaResumen(totalIncome, totalExpense, balance, monthTx);

    document.getElementById('view-economia').innerHTML = `
      <div class="page-head">
        <div><h1>Economía</h1><p>Ingresos, gastos y balance — historial permanente</p></div>
      </div>
      <div class="finance-tabs">
        <button class="finance-tab ${financeSubview==='resumen'?'active':''}" data-action="finance-tab" data-tab="resumen">Resumen</button>
        <button class="finance-tab ${financeSubview==='movimientos'?'active':''}" data-action="finance-tab" data-tab="movimientos">Movimientos</button>
        <button class="finance-tab ${financeSubview==='categorias'?'active':''}" data-action="finance-tab" data-tab="categorias">Categorías</button>
      </div>
      ${body}
    `;
  }

  function renderEconomiaResumen(totalIncome, totalExpense, balance, monthTx){
    const categoryOptions = state.finance.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    const thisMK = monthKeyOf(dkey(new Date()));
    const mk = resumenMonth;
    const monthIncome = sumOfList(monthTx,'income');
    const monthExpense = sumOfList(monthTx,'expense');
    const series = monthsSeriesEndingAt(mk, 6);
    const maxVal = Math.max(1, ...series.map(m=>Math.max(m.income, m.expense)));

    const monthNavHtml = `
      <div class="date-nav" style="margin:-6px 0 22px;">
        <button data-action="resumen-prev-month" title="Mes anterior">${icon('chevronLeft',16)}</button>
        <span style="font-size:13px; color:var(--text-muted); padding:0 4px; min-width:120px; text-align:center;">${monthLabel(mk)}</span>
        ${mk!==thisMK ? `<button class="today-btn" data-action="resumen-today-month">Mes actual</button>` : ''}
        <button data-action="resumen-next-month" title="Mes siguiente" ${mk===thisMK?'disabled':''}>${icon('chevronRight',16)}</button>
      </div>`;

    // --- Comparativa vs. mes anterior + promedio diario de gasto ---
    const curM = series[series.length-1];
    const prevM = series[series.length-2];
    function pctChange(cur, prev){
      if(prev<=0) return cur>0 ? null : 0;
      return Math.round(((cur-prev)/prev)*100);
    }
    const incChange = pctChange(curM.income, prevM.income);
    const expChange = pctChange(curM.expense, prevM.expense);
    const curBalance = curM.income - curM.expense;
    const prevBalance = prevM.income - prevM.expense;
    const dayOfMonth = daysElapsedInMonth(mk);
    const dailyAvgExpense = monthExpense / dayOfMonth;
    function changeHtml(pct, goodWhenUp){
      if(pct===null) return `<span class="chg">sin datos del mes anterior</span>`;
      const isGood = goodWhenUp ? pct>=0 : pct<=0;
      const cls = pct===0 ? '' : (isGood ? 'trend-up' : 'trend-down');
      const arrow = pct>0 ? '↑' : pct<0 ? '↓' : '→';
      return `<span class="chg ${cls}">${arrow} ${pct>0?'+':''}${pct}% vs. mes anterior</span>`;
    }
    const compareHtml = `
      <div class="compare-grid">
        <div class="compare-card">
          <div class="lbl">Ingresos — ${monthLabel(curM.mk)}</div>
          <div class="val">${fmtMoney(curM.income)}</div>
          ${changeHtml(incChange, true)}
        </div>
        <div class="compare-card">
          <div class="lbl">Gastos — ${monthLabel(curM.mk)}</div>
          <div class="val">${fmtMoney(curM.expense)}</div>
          ${changeHtml(expChange, false)}
        </div>
        <div class="compare-card">
          <div class="lbl">Balance del mes</div>
          <div class="val" style="color:${curBalance>=0?'var(--complete)':'var(--missed)'}">${fmtMoney(curBalance)}</div>
          <span class="chg">Mes anterior: ${fmtMoney(prevBalance)}</span>
        </div>
        <div class="compare-card">
          <div class="lbl">Promedio diario de gasto</div>
          <div class="val">${fmtMoney(dailyAvgExpense)}</div>
          <span class="chg">Sobre ${dayOfMonth} día${dayOfMonth===1?'':'s'} ${mk===thisMK?'transcurridos de':'de'} ${monthLabel(mk).split(' ')[0]}</span>
        </div>
      </div>`;

    const barsHtml = series.map(m=>{
      const bal = m.income - m.expense;
      const monthFull = MESES[parseInt(m.mk.slice(5,7),10)-1];
      const tip = `<span class='tt-title'>${monthFull.charAt(0).toUpperCase()+monthFull.slice(1)} ${m.mk.slice(0,4)}</span>
        <div class='tt-row'><span class='tt-label'><span class='tt-dot' style='background:var(--complete)'></span>Ingresos</span><strong>${fmtMoney(m.income)}</strong></div>
        <div class='tt-row'><span class='tt-label'><span class='tt-dot' style='background:var(--missed)'></span>Gastos</span><strong>${fmtMoney(m.expense)}</strong></div>
        <div class='tt-row'><span class='tt-label'>Balance</span><strong style='color:${bal>=0?'var(--complete)':'var(--missed)'}'>${fmtMoney(bal)}</strong></div>`;
      return `
      <div class="fin-month">
        <div class="fin-bars">
          <div class="fin-bar income" style="height:${Math.max(m.income/maxVal*100,m.income>0?4:0)}%" data-tooltip-html="${escapeHtml(tip)}"></div>
          <div class="fin-bar expense" style="height:${Math.max(m.expense/maxVal*100,m.expense>0?4:0)}%" data-tooltip-html="${escapeHtml(tip)}"></div>
        </div>
        <div class="fin-month-label">${m.label}</div>
      </div>`;}).join('');

    return `
      ${monthNavHtml}
      <div class="stat-grid stat-grid-3">
        <div class="stat-card">
          <div class="lbl">Balance total</div>
          <div class="val" style="color:${balance>=0?'var(--complete)':'var(--missed)'}">${fmtMoney(balance)}</div>
          <div class="sub">Histórico completo</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Ingresos del mes</div>
          <div class="val">${fmtMoney(monthIncome)}</div>
          <div class="sub">${mk===thisMK ? 'Mes en curso' : monthLabel(mk)}</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Gastos del mes</div>
          <div class="val">${fmtMoney(monthExpense)}</div>
          <div class="sub">${mk===thisMK ? 'Mes en curso' : monthLabel(mk)}</div>
        </div>
      </div>

      ${renderBudgetsCard(monthTx, mk)}

      <h3 style="font-family:var(--font-display); font-weight:500; font-size:15px; margin:0 0 4px; color:var(--text-muted);">Comparativa mensual</h3>
      ${compareHtml}

      <div class="finance-form">
        <h3>Registrar movimiento</h3>
        <form id="tx-form">
          <div class="type-toggle" id="tx-type-toggle" data-type="expense">
            <button type="button" data-action="tx-set-type" data-type="expense" class="active-expense">Gasto</button>
            <button type="button" data-action="tx-set-type" data-type="income">Ingreso</button>
          </div>
          <div class="finance-form-grid" style="margin-top:16px;">
            <div class="field" style="margin-bottom:0;">
              <label for="tx-category">Categoría</label>
              <select id="tx-category">${categoryOptions}</select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="tx-amount">Monto</label>
              <div class="amount-field-wrap">
                <input type="number" step="0.01" min="0.01" id="tx-amount" required>
                <button type="button" class="calc-btn ${calcOpenFor==='tx-amount'?'active':''}" data-action="calc-toggle" data-target="tx-amount" title="Calculadora">=</button>
                ${calculatorHtml('tx-amount')}
              </div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="tx-date">Fecha</label>
              <input type="date" id="tx-date" value="${dkey(new Date())}">
            </div>
          </div>
          <div class="field" style="margin:14px 0 0;">
            <label for="tx-note">Nota (opcional)</label>
            <input type="text" id="tx-note" maxlength="80" placeholder="Ej: Supermercado del sábado">
          </div>
          <button type="submit" class="btn-primary" style="margin-top:16px; width:auto; padding:12px 22px;">Agregar movimiento</button>
        </form>
      </div>

      <div class="card">
        <h3>Ingresos vs gastos (6 meses hasta ${monthLabel(mk)})</h3>
        <p class="card-sub">Suma de movimientos cargados por mes</p>
        <div class="fin-chart">${barsHtml}</div>
        <div class="fin-legend">
          <span><span class="dot" style="background:var(--complete)"></span>Ingresos</span>
          <span><span class="dot" style="background:var(--missed)"></span>Gastos</span>
        </div>
      </div>
    `;
  }

  function renderBudgetsCard(monthTx, mk){
    const catBudgets = state.finance.categories.filter(c=>c.budget && c.budget>0);
    if(catBudgets.length===0){
      return `
        <div class="card" style="margin-bottom:24px;">
          <h3>Presupuestos del mes</h3>
          <p class="empty">Todavía no definiste un tope mensual para ninguna categoría. Podés hacerlo desde la pestaña Categorías.</p>
        </div>`;
    }
    const spentMap = {};
    monthTx.filter(t=>t.type==='expense').forEach(t=>{ spentMap[t.categoryId] = (spentMap[t.categoryId]||0) + (parseFloat(t.amount)||0); });
    const rows = catBudgets.map(c=>{
      const spent = spentMap[c.id] || 0;
      const pct = Math.round(spent/c.budget*100);
      const over = spent > c.budget;
      const barPct = Math.min(pct,100);
      return `
        <div class="budget-row ${over?'is-over':''}">
          <div class="budget-row-head">
            <span class="budget-name">${escapeHtml(c.name)}</span>
            <span class="budget-val">${fmtMoney(spent)} / ${fmtMoney(c.budget)} · ${pct}%${over ? ' · ¡superado!' : ''}</span>
          </div>
          <div class="budget-track"><div class="budget-fill ${over?'over':''}" style="width:${barPct}%"></div></div>
        </div>`;
    }).join('');
    return `
      <div class="card" style="margin-bottom:24px;">
        <h3>Presupuestos del mes</h3>
        <p class="card-sub">${monthLabel(mk)} — tope mensual definido por categoría</p>
        ${rows}
      </div>`;
  }

  function renderEconomiaMovimientos(tx){
    const filtered = tx.filter(t=>{
      if(movFilterFrom && t.date < movFilterFrom) return false;
      if(movFilterTo && t.date > movFilterTo) return false;
      if(movFilterType!=='all' && t.type!==movFilterType) return false;
      if(movFilterCat!=='all' && t.categoryId!==movFilterCat) return false;
      return true;
    });
    const allCatOptions = [...state.finance.categories, ...state.finance.incomeTypes]
      .map(c=>`<option value="${c.id}" ${movFilterCat===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
    const hasFilters = movFilterFrom || movFilterTo || movFilterCat!=='all' || movFilterType!=='all';
    const exportBtn = tx.length>0 ? `<button type="button" class="btn-ghost" data-action="export-tx-csv" style="width:auto; padding:8px 16px; margin:0 0 16px auto; display:flex;">${icon('download',13)} Exportar CSV</button>` : '';
    const filterBar = `
      <div class="mov-filters">
        <div class="field-sm">
          <label>Desde</label>
          <input type="date" id="mov-filter-from" data-action="mov-filter-change" value="${movFilterFrom}">
        </div>
        <div class="field-sm">
          <label>Hasta</label>
          <input type="date" id="mov-filter-to" data-action="mov-filter-change" value="${movFilterTo}">
        </div>
        <div class="field-sm">
          <label>Tipo</label>
          <select id="mov-filter-type" data-action="mov-filter-change">
            <option value="all" ${movFilterType==='all'?'selected':''}>Todos</option>
            <option value="income" ${movFilterType==='income'?'selected':''}>Ingresos</option>
            <option value="expense" ${movFilterType==='expense'?'selected':''}>Gastos</option>
          </select>
        </div>
        <div class="field-sm">
          <label>Categoría</label>
          <select id="mov-filter-cat" data-action="mov-filter-change">
            <option value="all" ${movFilterCat==='all'?'selected':''}>Todas</option>
            ${allCatOptions}
          </select>
        </div>
        ${hasFilters ? `<button type="button" class="btn-tiny" data-action="mov-filter-clear" style="align-self:flex-end;">${icon('trash',11)} Limpiar filtros</button>` : ''}
      </div>`;

    if(tx.length===0) return `<p class="empty">Todavía no registraste ningún movimiento. Agregá el primero desde la pestaña Resumen.</p>`;
    if(filtered.length===0) return exportBtn + filterBar + `<p class="empty">No hay movimientos que coincidan con esos filtros.</p>`;

    const filteredIncome = sumOfList(filtered,'income'), filteredExpense = sumOfList(filtered,'expense');
    const summaryBar = hasFilters ? `<p class="mov-filter-summary">${filtered.length} movimiento${filtered.length===1?'':'s'} · Ingresos ${fmtMoney(filteredIncome)} · Gastos ${fmtMoney(filteredExpense)}</p>` : '';

    let html = exportBtn + filterBar + summaryBar + '<div class="tx-list">';
    let lastMonth = null;
    filtered.forEach(t=>{
      const mk = monthKeyOf(t.date);
      if(mk !== lastMonth){ html += `<p class="tx-month-title">${monthLabel(mk)}</p>`; lastMonth = mk; }
      const name = catName(t.categoryId, t.type);
      const sign = t.type==='income' ? '+' : '−';
      html += `
        <div class="tx-row">
          <div class="tx-icon ${t.type}">${icon(t.type==='income'?'chevronUp':'chevronDown',16)}</div>
          <div class="tx-date">${t.date}</div>
          <div class="tx-info">
            <div class="tx-cat">${escapeHtml(name)}</div>
            ${t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : ''}
          </div>
          <div class="tx-amount ${t.type}">${sign}${fmtMoney(t.amount)}</div>
          <button class="icon-btn danger" data-action="delete-tx" data-id="${t.id}" title="Eliminar">${icon('trash',14)}</button>
        </div>`;
    });
    html += '</div>';
    return html;
  }

  function renderEconomiaCategorias(){
    const editingCat = editingCategoryId ? state.finance.categories.find(c=>c.id===editingCategoryId) : null;
    const editingInc = editingIncomeTypeId ? state.finance.incomeTypes.find(c=>c.id===editingIncomeTypeId) : null;

    // --- Distribución de gastos (ranking de categorías) ---
    const byCat = expenseByCategory();
    const catTotal = byCat.reduce((s,c)=>s+c.total,0);
    const distHtml = byCat.length===0 ? `<p class="empty">Todavía no hay gastos cargados para mostrar la distribución.</p>` : `
      <div class="cat-dist">
        ${byCat.map((c,idx)=>{
          const pct = catTotal>0 ? Math.round(c.total/catTotal*100) : 0;
          const col = CAT_PALETTE[idx%CAT_PALETTE.length];
          const tip = `<span class='tt-title'>${escapeHtml(c.name)}</span><div class='tt-row'><span class='tt-label'>Gastado</span><strong>${fmtMoney(c.total)}</strong></div><div class='tt-row'><span class='tt-label'>Del total</span><strong>${pct}%</strong></div>`;
          return `
          <div class="cat-dist-row" data-tooltip-html="${escapeHtml(tip)}">
            <span class="cat-dist-name"><span class="tt-dot" style="background:${col}"></span>${escapeHtml(c.name)}</span>
            <div class="cat-dist-track"><div class="cat-dist-fill" style="width:${pct}%; background:${col}"></div></div>
            <span class="cat-dist-val">${fmtMoney(c.total)}</span>
          </div>`;
        }).join('')}
      </div>`;

    const catRows = state.finance.categories.length ? state.finance.categories.map(c=>`
      <div class="habit-manage-row">
        <div class="meta"><div class="n">${escapeHtml(c.name)}</div><div class="g">${c.budget ? 'Tope: '+fmtMoney(c.budget)+' / mes' : 'Sin tope mensual definido'}</div></div>
        <div class="row-actions">
          <button class="icon-btn" data-action="edit-category" data-id="${c.id}" title="Editar">${icon('pencil',14)}</button>
          <button class="icon-btn danger" data-action="delete-category" data-id="${c.id}" title="Eliminar">${icon('trash',14)}</button>
        </div>
      </div>`).join('') : '<p class="empty">Todavía no hay categorías.</p>';

    const incRows = state.finance.incomeTypes.length ? state.finance.incomeTypes.map(c=>`
      <div class="habit-manage-row">
        <div class="meta"><div class="n">${escapeHtml(c.name)}</div></div>
        <div class="row-actions">
          <button class="icon-btn" data-action="edit-income-type" data-id="${c.id}" title="Editar">${icon('pencil',14)}</button>
          <button class="icon-btn danger" data-action="delete-income-type" data-id="${c.id}" title="Eliminar">${icon('trash',14)}</button>
        </div>
      </div>`).join('') : '<p class="empty">Todavía no hay tipos de ingreso.</p>';

    // --- Movimientos recurrentes ---
    const recType = recTypeToggle;
    const recCatOptions = (recType==='expense' ? state.finance.categories : state.finance.incomeTypes)
      .map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    const recRows = (state.finance.recurring||[]).length ? state.finance.recurring.map(r=>`
      <div class="habit-manage-row ${r.active?'':'is-paused'}">
        <div class="meta">
          <div class="n">${escapeHtml(catName(r.categoryId, r.type))} — ${fmtMoney(r.amount)} <span style="color:var(--text-faint); font-weight:400;">(${r.type==='income'?'ingreso':'gasto'})</span></div>
          <div class="g">Día ${r.day} de cada mes${r.note?' · '+escapeHtml(r.note):''}${r.active?'':' · pausado'}</div>
        </div>
        <div class="row-actions">
          <button class="icon-btn" data-action="toggle-recurring" data-id="${r.id}" title="${r.active?'Pausar':'Reanudar'}">${icon(r.active?'pause':'play',14)}</button>
          <button class="icon-btn danger" data-action="delete-recurring" data-id="${r.id}" title="Eliminar">${icon('trash',14)}</button>
        </div>
      </div>`).join('') : '<p class="empty">Todavía no cargaste movimientos recurrentes.</p>';

    const recurringHtml = `
      <div class="finance-form" style="margin-bottom:24px;">
        <h3>Movimientos recurrentes</h3>
        <p class="card-sub" style="margin-top:-8px;">Se cargan solos cada mes a partir del día que elijas — alquiler, sueldo, suscripciones</p>
        <form id="recurring-form">
          <div class="type-toggle" id="rec-type-toggle" data-type="${recType}">
            <button type="button" data-action="rec-set-type" data-type="expense" class="${recType==='expense'?'active-expense':''}">Gasto</button>
            <button type="button" data-action="rec-set-type" data-type="income" class="${recType==='income'?'active-income':''}">Ingreso</button>
          </div>
          <div class="finance-form-grid" style="margin-top:16px;">
            <div class="field" style="margin-bottom:0;">
              <label for="rec-category">Categoría</label>
              <select id="rec-category">${recCatOptions}</select>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="rec-amount">Monto</label>
              <input type="number" step="0.01" min="0.01" id="rec-amount" required>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="rec-day">Día del mes</label>
              <input type="number" id="rec-day" min="1" max="28" value="1" required>
            </div>
          </div>
          <div class="field" style="margin:14px 0 0;">
            <label for="rec-note">Nota (opcional)</label>
            <input type="text" id="rec-note" maxlength="60" placeholder="Ej: Alquiler depto">
          </div>
          <button type="submit" class="btn-primary" style="margin-top:16px; width:auto; padding:12px 22px;">Agregar recurrente</button>
        </form>
        <div style="margin-top:16px;">${recRows}</div>
      </div>`;

    return `
      ${recurringHtml}
      <div class="card" style="margin-bottom:24px;">
        <h3>Distribución de gastos</h3>
        <p class="card-sub">Cuánto pesa cada categoría sobre el total gastado</p>
        ${distHtml}
      </div>
      <div class="admin-grid-even">
        <div>
          <div class="form-card" style="position:static; margin-bottom:18px;">
            <h3>${editingCat ? 'Editar categoría de gasto' : 'Nueva categoría de gasto'}</h3>
            <form id="category-form">
              <div class="field">
                <label for="category-name">Nombre</label>
                <input type="text" id="category-name" maxlength="30" placeholder="Ej: Mascotas" value="${editingCat ? escapeHtml(editingCat.name) : ''}" required>
              </div>
              <div class="field">
                <label for="category-budget">Tope mensual (opcional)</label>
                <input type="number" id="category-budget" min="0" step="1" placeholder="Ej: 150000" value="${editingCat && editingCat.budget ? editingCat.budget : ''}">
              </div>
              <button type="submit" class="btn-primary">${editingCat ? 'Guardar cambios' : 'Agregar categoría'}</button>
              ${editingCat ? `<button type="button" class="btn-ghost" data-action="cancel-edit-category">Cancelar edición</button>` : ''}
            </form>
          </div>
          <p class="group-title">Categorías de gasto</p>
          ${catRows}
        </div>
        <div>
          <div class="form-card" style="position:static; margin-bottom:18px;">
            <h3>${editingInc ? 'Editar tipo de ingreso' : 'Nuevo tipo de ingreso'}</h3>
            <form id="income-type-form">
              <div class="field">
                <label for="income-type-name">Nombre</label>
                <input type="text" id="income-type-name" maxlength="30" placeholder="Ej: Alquiler" value="${editingInc ? escapeHtml(editingInc.name) : ''}" required>
              </div>
              <button type="submit" class="btn-primary">${editingInc ? 'Guardar cambios' : 'Agregar tipo'}</button>
              ${editingInc ? `<button type="button" class="btn-ghost" data-action="cancel-edit-income-type">Cancelar edición</button>` : ''}
            </form>
          </div>
          <p class="group-title">Tipos de ingreso</p>
          ${incRows}
        </div>
      </div>
    `;
  }

  /* ================= RENDER GENERAL ================= */
  function render(){
    renderNav();
    if(currentView==='dashboard') renderDashboard();
    if(currentView==='hoy') renderHoy();
    if(currentView==='panel') renderPanel();
    if(currentView==='habitos') renderHabitos();
    if(currentView==='rutina') renderRutina();
    if(currentView==='economia') renderEconomia();
  }

  /* ================= EVENTOS ================= */
  document.addEventListener('click', (e)=>{
    const navBtn = e.target.closest('.nav-btn');
    if(navBtn){ currentView = navBtn.dataset.view; render(); return; }

    const actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    const action = actionEl.dataset.action;

    if(action==='set-status'){
      const habitId = actionEl.closest('.seg').dataset.habit;
      setStatus(dkey(viewDate), habitId, actionEl.dataset.status);
      renderHoy();
    }
    else if(action==='toggle-exercise'){
      const habitId = actionEl.dataset.habit;
      const exId = actionEl.dataset.ex;
      const dateKey = dkey(viewDate);
      const plan = workoutPlanFor(habitId, viewDate);
      const cur = getExLog(dateKey, habitId, exId);
      setExDone(dateKey, habitId, exId, !cur.done);
      if(plan) syncWorkoutStatus(dateKey, habitId, plan);
      renderHoy();
    }
    else if(action==='toggle-workout-expand'){
      const id = actionEl.dataset.habit;
      expandedWorkouts[id] = !expandedWorkouts[id];
      renderHoy();
    }
    else if(action==='prev-day'){ viewDate = addDays(viewDate,-1); renderHoy(); }
    else if(action==='next-day'){ if(!isSameDay(viewDate,new Date())){ viewDate = addDays(viewDate,1); renderHoy(); } }
    else if(action==='go-today'){ viewDate = new Date(); renderHoy(); }
    else if(action==='toggle-habit-pause'){
      toggleHabitPause(actionEl.dataset.id);
      renderHabitos();
    }
    else if(action==='edit-habit'){ editingHabitId = actionEl.dataset.id; renderHabitos(); window.scrollTo({top:0, behavior:'smooth'}); }
    else if(action==='cancel-edit'){ editingHabitId = null; renderHabitos(); }
    else if(action==='delete-habit'){
      const h = state.habits.find(x=>x.id===actionEl.dataset.id);
      if(h && confirm(`¿Eliminar "${h.name}"? El historial de días anteriores para este hábito se conserva pero dejará de mostrarse.`)){
        state.habits = state.habits.filter(x=>x.id!==actionEl.dataset.id);
        if(editingHabitId===actionEl.dataset.id) editingHabitId=null;
        saveState();
        renderHabitos();
      }
    }
    else if(action==='move-habit'){
      const id = actionEl.dataset.id, dir = parseInt(actionEl.dataset.dir,10);
      const habit = state.habits.find(x=>x.id===id);
      const sameGroup = state.habits.filter(x=>x.group===habit.group);
      const posInGroup = sameGroup.indexOf(habit);
      const swapWith = sameGroup[posInGroup+dir];
      if(swapWith){
        const iA = state.habits.indexOf(habit), iB = state.habits.indexOf(swapWith);
        [state.habits[iA], state.habits[iB]] = [state.habits[iB], state.habits[iA]];
        saveState();
        renderHabitos();
      }
    }
    else if(action==='toggle-theme'){
      applyTheme(loadTheme()==='light' ? 'dark' : 'light');
    }
    else if(action==='toggle-sidebar'){
      applySidebar(!document.getElementById('sidebar').classList.contains('collapsed'));
    }
    else if(action==='quick-set-status'){
      const habitId = actionEl.closest('.qh-seg').dataset.habit;
      setStatus(dkey(new Date()), habitId, actionEl.dataset.status);
      renderDashboard();
    }
    else if(action==='toggle-task'){
      toggleTask(actionEl.dataset.id);
      renderDashboard();
    }
    else if(action==='delete-task'){
      deleteTask(actionEl.dataset.id);
      if(editingTaskId===actionEl.dataset.id) editingTaskId=null;
      renderDashboard();
    }
    else if(action==='edit-task'){
      editingTaskId = actionEl.dataset.id;
      renderDashboard();
    }
    else if(action==='cancel-edit-task'){
      editingTaskId = null;
      renderDashboard();
    }
    else if(action==='set-task-priority'){
      setTaskPriority(actionEl.dataset.id, actionEl.dataset.priority);
      renderDashboard();
    }
    else if(action==='save-task-details'){
      const id = actionEl.dataset.id;
      const startDate = document.getElementById('task-edit-start').value;
      const dueDate = document.getElementById('task-edit-due-date').value;
      const dueTime = document.getElementById('task-edit-due-time').value;
      setTaskDates(id, startDate, dueDate, dueTime);
      editingTaskId = null;
      renderDashboard();
    }
    else if(action==='add-reminder'){
      const id = actionEl.dataset.id;
      const startDate = document.getElementById('task-edit-start').value;
      const dueDate = document.getElementById('task-edit-due-date').value;
      const dueTime = document.getElementById('task-edit-due-time').value;
      if(dueDate) setTaskDates(id, startDate, dueDate, dueTime);
      const amount = document.getElementById('task-edit-remind-amount').value;
      const unit = document.getElementById('task-edit-remind-unit').value;
      addReminder(id, amount, unit);
      renderDashboard();
    }
    else if(action==='remove-reminder'){
      removeReminder(actionEl.dataset.id, actionEl.dataset.rid);
      renderDashboard();
    }
    else if(action==='enable-notifications'){
      requestNotifPermission();
    }
    else if(action==='calc-toggle'){
      const target = actionEl.dataset.target;
      calcOpenFor = (calcOpenFor === target) ? null : target;
      calcExpr = '';
      renderCalcOwner(target);
    }
    else if(action==='calc-key'){
      calcExpr += actionEl.dataset.key;
      renderCalcOwner(actionEl.dataset.target);
    }
    else if(action==='calc-clear'){
      calcExpr = '';
      renderCalcOwner(actionEl.dataset.target);
    }
    else if(action==='calc-equals'){
      const result = safeEvalCalc(calcExpr);
      calcExpr = result!==null ? String(result) : '';
      renderCalcOwner(actionEl.dataset.target);
    }
    else if(action==='calc-use'){
      const target = actionEl.dataset.target;
      const val = actionEl.dataset.value;
      calcOpenFor = null;
      calcExpr = '';
      renderCalcOwner(target);
      const input = document.getElementById(target);
      if(input) input.value = val;
    }
    else if(action==='econ-set-type'){
      const toggle = document.getElementById('econ-type-toggle');
      toggle.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      actionEl.classList.add('active');
      toggle.dataset.type = actionEl.dataset.type;
      const select = document.getElementById('econ-category');
      const opts = actionEl.dataset.type==='expense' ? state.finance.categories : state.finance.incomeTypes;
      select.innerHTML = opts.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }
    else if(action==='finance-tab'){
      financeSubview = actionEl.dataset.tab;
      renderEconomia();
    }
    else if(action==='tx-set-type'){
      const toggle = document.getElementById('tx-type-toggle');
      toggle.querySelectorAll('button').forEach(b=>b.classList.remove('active-income','active-expense'));
      actionEl.classList.add(actionEl.dataset.type==='income' ? 'active-income' : 'active-expense');
      toggle.dataset.type = actionEl.dataset.type;
      const select = document.getElementById('tx-category');
      const opts = actionEl.dataset.type==='expense' ? state.finance.categories : state.finance.incomeTypes;
      select.innerHTML = opts.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }
    else if(action==='delete-tx'){
      if(confirm('¿Eliminar este movimiento?')){ deleteTx(actionEl.dataset.id); renderEconomia(); }
    }
    else if(action==='edit-category'){ editingCategoryId = actionEl.dataset.id; renderEconomia(); }
    else if(action==='cancel-edit-category'){ editingCategoryId = null; renderEconomia(); }
    else if(action==='delete-category'){
      const c = state.finance.categories.find(x=>x.id===actionEl.dataset.id);
      if(c && confirm(`¿Eliminar "${c.name}"? Los movimientos ya cargados quedan como "Sin categoría".`)){
        state.finance.categories = state.finance.categories.filter(x=>x.id!==actionEl.dataset.id);
        if(editingCategoryId===actionEl.dataset.id) editingCategoryId = null;
        saveState();
        renderEconomia();
      }
    }
    else if(action==='edit-income-type'){ editingIncomeTypeId = actionEl.dataset.id; renderEconomia(); }
    else if(action==='cancel-edit-income-type'){ editingIncomeTypeId = null; renderEconomia(); }
    else if(action==='delete-income-type'){
      const c = state.finance.incomeTypes.find(x=>x.id===actionEl.dataset.id);
      if(c && confirm(`¿Eliminar "${c.name}"? Los movimientos ya cargados quedan como "Sin categoría".`)){
        state.finance.incomeTypes = state.finance.incomeTypes.filter(x=>x.id!==actionEl.dataset.id);
        if(editingIncomeTypeId===actionEl.dataset.id) editingIncomeTypeId = null;
        saveState();
        renderEconomia();
      }
    }
    else if(action==='goto-date'){
      goToDate(actionEl.dataset.date);
    }
    else if(action==='export-data'){
      exportData();
      render();
    }
    else if(action==='reset-all'){
      if(confirm('Esto borra todos tus hábitos y todo el historial. ¿Continuar?') && confirm('Confirmá de nuevo: se pierde todo lo registrado hasta ahora.')){
        state = {habits:defaultHabits(), logs:{}, tasks:[], km_logs:{}, finance:defaultFinance(), exercise_logs:{}, workout_plan:defaultWorkoutPlan(), weight_logs:{}, day_notes:{}};
        editingHabitId = null;
        saveState();
        renderHabitos();
      }
    }
    else if(action==='toggle-ex-history'){
      const exId = actionEl.dataset.ex;
      expandedExHistory[exId] = !expandedExHistory[exId];
      renderHoy();
    }
    else if(action==='set-dash-chart-mode'){
      dashChartMode = actionEl.dataset.mode;
      renderDashboard();
    }
    else if(action==='delete-weight'){
      deleteWeightEntry(actionEl.dataset.date);
      renderPanel();
    }
    else if(action==='select-rutina-day'){
      rutinaDay = actionEl.dataset.day;
      renderRutina();
    }
    else if(action==='add-plan-session'){
      addPlanSession(actionEl.dataset.day, actionEl.dataset.session);
    }
    else if(action==='delete-plan-session'){
      deletePlanSession(actionEl.dataset.day, actionEl.dataset.session);
    }
    else if(action==='add-plan-group'){
      addPlanGroup(actionEl.dataset.day, actionEl.dataset.session);
    }
    else if(action==='delete-plan-group'){
      deletePlanGroup(actionEl.dataset.day, actionEl.dataset.session, parseInt(actionEl.dataset.gi,10));
    }
    else if(action==='add-plan-exercise'){
      addPlanExercise(actionEl.dataset.day, actionEl.dataset.session, parseInt(actionEl.dataset.gi,10));
    }
    else if(action==='delete-plan-exercise'){
      deletePlanExercise(actionEl.dataset.day, actionEl.dataset.session, parseInt(actionEl.dataset.gi,10), parseInt(actionEl.dataset.ei,10));
    }
    else if(action==='reset-plan-all'){
      resetPlanToDefault();
    }
    else if(action==='rec-set-type'){
      const toggle = document.getElementById('rec-type-toggle');
      toggle.querySelectorAll('button').forEach(b=>b.classList.remove('active-income','active-expense'));
      actionEl.classList.add(actionEl.dataset.type==='income' ? 'active-income' : 'active-expense');
      toggle.dataset.type = actionEl.dataset.type;
      recTypeToggle = actionEl.dataset.type;
      const select = document.getElementById('rec-category');
      const opts = actionEl.dataset.type==='expense' ? state.finance.categories : state.finance.incomeTypes;
      select.innerHTML = opts.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    }
    else if(action==='toggle-recurring'){
      toggleRecurringActive(actionEl.dataset.id);
      renderEconomia();
    }
    else if(action==='delete-recurring'){
      if(confirm('¿Eliminar este movimiento recurrente? Los movimientos ya cargados por él no se borran.')){
        deleteRecurring(actionEl.dataset.id);
        renderEconomia();
      }
    }
    else if(action==='export-tx-csv'){
      exportTxCSV(allTx());
    }
    else if(action==='resumen-prev-month'){
      resumenMonth = shiftMonthKey(resumenMonth, -1);
      renderEconomia();
    }
    else if(action==='resumen-next-month'){
      const thisMK = monthKeyOf(dkey(new Date()));
      const next = shiftMonthKey(resumenMonth, 1);
      if(next <= thisMK) resumenMonth = next;
      renderEconomia();
    }
    else if(action==='resumen-today-month'){
      resumenMonth = monthKeyOf(dkey(new Date()));
      renderEconomia();
    }
  });

  document.addEventListener('change', (e)=>{
    if(e.target.id === 'date-jump' && e.target.value){
      goToDate(e.target.value);
    }
    if(e.target.id === 'import-file' && e.target.files[0]){
      importDataFile(e.target.files[0]);
      e.target.value = '';
    }
    if(e.target.id === 'dash-period'){ dashPeriod = e.target.value; renderDashboard(); }
    if(e.target.id === 'dash-compare'){ dashCompare = e.target.checked; renderDashboard(); }
    if(e.target.id === 'km-period'){ kmPeriod = e.target.value; renderDashboard(); }
    if(e.target.dataset && e.target.dataset.action === 'set-task-recurrence'){
      setTaskRecurrence(e.target.dataset.id, e.target.value);
      renderDashboard();
    }
    if(e.target.dataset && e.target.dataset.action === 'log-exercise-note'){
      setExNote(dkey(viewDate), e.target.dataset.habit, e.target.dataset.ex, e.target.value);
    }
    if(e.target.id === 'day-note-input'){
      setDayNote(dkey(viewDate), e.target.value);
    }
    if(e.target.dataset && e.target.dataset.action === 'plan-title'){
      setPlanTitle(e.target.dataset.day, e.target.dataset.session, e.target.value);
    }
    if(e.target.dataset && e.target.dataset.action === 'plan-group-name'){
      setPlanGroupName(e.target.dataset.day, e.target.dataset.session, parseInt(e.target.dataset.gi,10), e.target.value);
    }
    if(e.target.dataset && e.target.dataset.action === 'plan-ex-name'){
      setPlanExerciseField(e.target.dataset.day, e.target.dataset.session, parseInt(e.target.dataset.gi,10), parseInt(e.target.dataset.ei,10), 'name', e.target.value);
    }
    if(e.target.dataset && e.target.dataset.action === 'plan-ex-target'){
      setPlanExerciseField(e.target.dataset.day, e.target.dataset.session, parseInt(e.target.dataset.gi,10), parseInt(e.target.dataset.ei,10), 'target', e.target.value);
    }
    if(e.target.id === 'mov-filter-from'){ movFilterFrom = e.target.value; renderEconomia(); }
    if(e.target.id === 'mov-filter-to'){ movFilterTo = e.target.value; renderEconomia(); }
    if(e.target.id === 'mov-filter-type'){ movFilterType = e.target.value; renderEconomia(); }
    if(e.target.id === 'mov-filter-cat'){ movFilterCat = e.target.value; renderEconomia(); }
  });

  document.addEventListener('submit', (e)=>{
    if(e.target.id !== 'habit-form') return;
    e.preventDefault();
    const name = document.getElementById('habit-name').value.trim();
    const group = document.getElementById('habit-group').value;
    const iconInput = document.querySelector('input[name="habit-icon"]:checked');
    const iconKey = iconInput ? iconInput.value : 'target';
    if(!name) return;

    if(editingHabitId){
      const h = state.habits.find(x=>x.id===editingHabitId);
      h.name = name; h.group = group; h.icon = iconKey;
      editingHabitId = null;
    } else {
      const id = 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      state.habits.push({id, name, group, icon:iconKey});
    }
    saveState();
    renderHabitos();
  });

  document.addEventListener('submit', (e)=>{
    if(e.target.id === 'task-form'){
      e.preventDefault();
      const input = document.getElementById('task-input');
      addTask(input.value);
      input.value = '';
      renderDashboard();
      return;
    }
    if(e.target.id === 'km-form'){
      e.preventDefault();
      const val = document.getElementById('km-today-input').value;
      const key = dkey(new Date());
      if(val && parseFloat(val)>0) state.km_logs[key] = parseFloat(val);
      else delete state.km_logs[key];
      saveState();
      renderDashboard();
      return;
    }
    if(e.target.id === 'weight-form'){
      e.preventDefault();
      const d = document.getElementById('weight-date-input').value || dkey(new Date());
      const kg = document.getElementById('weight-kg-input').value;
      addWeightEntry(d, kg);
      renderPanel();
      return;
    }
    if(e.target.id === 'econ-form'){
      e.preventDefault();
      const toggle = document.getElementById('econ-type-toggle');
      const type = toggle.dataset.type || 'expense';
      const amount = document.getElementById('econ-amount').value;
      const category = document.getElementById('econ-category').value;
      const note = document.getElementById('econ-note').value;
      addTx(type, amount, category, null, note);
      renderDashboard();
      return;
    }
    if(e.target.id === 'tx-form'){
      e.preventDefault();
      const toggle = document.getElementById('tx-type-toggle');
      const type = toggle.dataset.type || 'expense';
      const amount = document.getElementById('tx-amount').value;
      const category = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value || dkey(new Date());
      const note = document.getElementById('tx-note').value;
      addTx(type, amount, category, date, note);
      renderEconomia();
      return;
    }
    if(e.target.id === 'category-form'){
      e.preventDefault();
      const name = document.getElementById('category-name').value.trim();
      if(!name) return;
      const budgetRaw = document.getElementById('category-budget').value;
      const budget = budgetRaw ? parseFloat(budgetRaw) : null;
      if(editingCategoryId){
        const c = state.finance.categories.find(x=>x.id===editingCategoryId);
        c.name = name;
        c.budget = (budget && budget>0) ? budget : null;
        editingCategoryId = null;
      } else {
        state.finance.categories.push({id:'cat_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, budget: (budget && budget>0) ? budget : null});
      }
      saveState();
      renderEconomia();
      return;
    }
    if(e.target.id === 'income-type-form'){
      e.preventDefault();
      const name = document.getElementById('income-type-name').value.trim();
      if(!name) return;
      if(editingIncomeTypeId){
        const c = state.finance.incomeTypes.find(x=>x.id===editingIncomeTypeId);
        c.name = name;
        editingIncomeTypeId = null;
      } else {
        state.finance.incomeTypes.push({id:'inc_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name});
      }
      saveState();
      renderEconomia();
      return;
    }
    if(e.target.id === 'recurring-form'){
      e.preventDefault();
      const toggle = document.getElementById('rec-type-toggle');
      const type = toggle.dataset.type || 'expense';
      const category = document.getElementById('rec-category').value;
      const amount = document.getElementById('rec-amount').value;
      const day = document.getElementById('rec-day').value;
      const note = document.getElementById('rec-note').value;
      addRecurring(type, amount, category, day, note);
      processRecurring();
      renderEconomia();
      return;
    }
  });

  /* ================= TOOLTIPS CUSTOM ================= */
  // Reemplaza el title nativo del navegador por una tarjeta estética propia.
  // Se engancha a nivel document (delegado), así que sobrevive a cualquier
  // re-render por innerHTML sin necesidad de re-bindear nada.
  function initTooltips(){
    const tt = document.createElement('div');
    tt.className = 'app-tooltip';
    tt.id = 'app-tooltip';
    document.body.appendChild(tt);

    function place(x, y){
      const pad = 12;
      const r = tt.getBoundingClientRect();
      let left = x - r.width/2;
      let top = y - r.height - pad;
      if(left < 8) left = 8;
      if(left + r.width > window.innerWidth - 8) left = window.innerWidth - 8 - r.width;
      if(top < 8) top = y + pad;
      tt.style.left = left + 'px';
      tt.style.top = top + 'px';
    }
    function show(el, x, y){
      const html = el.getAttribute('data-tooltip-html');
      const plain = el.getAttribute('data-tooltip');
      if(html) tt.innerHTML = html;
      else if(plain) tt.textContent = plain;
      else return;
      tt.classList.add('visible');
      place(x, y);
    }
    function hide(){ tt.classList.remove('visible'); }

    document.addEventListener('mouseover', (e)=>{
      const el = e.target.closest('[data-tooltip],[data-tooltip-html]');
      if(!el) return;
      show(el, e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e)=>{
      if(!tt.classList.contains('visible')) return;
      const el = e.target.closest('[data-tooltip],[data-tooltip-html]');
      if(!el){ hide(); return; }
      place(e.clientX, e.clientY);
    });
    document.addEventListener('mouseout', (e)=>{
      const el = e.target.closest('[data-tooltip],[data-tooltip-html]');
      if(el && !el.contains(e.relatedTarget)) hide();
    });
    document.addEventListener('scroll', hide, true);
    // Soporte táctil: tocar muestra la info un momento, tocar afuera la cierra.
    document.addEventListener('touchstart', (e)=>{
      const el = e.target.closest('[data-tooltip],[data-tooltip-html]');
      if(el){
        const t = e.touches[0];
        show(el, t.clientX, t.clientY);
        clearTimeout(tt._hideTimer);
        tt._hideTimer = setTimeout(hide, 2600);
      } else {
        hide();
      }
    }, {passive:true});
  }

  /* ================= LOGIN / INICIO ================= */
  function showLogin(){
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-root').style.display = 'none';
  }
  function hideLogin(){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-root').style.display = '';
  }

  async function startApp(){
    hideLogin();
    state = await loadStateFromCloud();
    processRecurring();
    applyTheme(loadTheme());
    render();
    applySidebar(loadSidebarCollapsed());
    initTooltips();
    checkReminders();
    setInterval(checkReminders, 30000);
  }

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';
    const {data, error} = await supabase.auth.signInWithPassword({email, password});
    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
    if(error){
      errorEl.textContent = 'Email o contraseña incorrectos.';
      return;
    }
    currentUserId = data.user.id;
    startApp();
  });

  document.addEventListener('click', (e)=>{
    if(e.target.dataset && e.target.dataset.action === 'logout'){
      supabase.auth.signOut().then(()=>{ window.location.reload(); });
    }
  });

  // Registro del service worker (necesario para que se pueda instalar como PWA).
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW no registrado', e));
    });
  }

  // Al cargar la página, revisa si ya había una sesión activa (para no
  // tener que loguearse cada vez que se entra desde el mismo navegador).
  (async function init(){
    const {data:{session}} = await supabase.auth.getSession();
    if(session && session.user){
      currentUserId = session.user.id;
      startApp();
    } else {
      showLogin();
    }
  })();
})();
</script>
